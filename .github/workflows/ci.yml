name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OfficeMetaCleaner.sln

      - name: Build (Release)
        run: dotnet build OfficeMetaCleaner.sln -c Release --no-restore

      - name: Test
        run: dotnet test OfficeMetaCleaner.sln -c Release --no-build
